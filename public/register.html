<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Warranty & Repair Ticket Management System</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-panel">
        <p class="eyebrow">Service Desk</p>
        <h1>Create Account</h1>
        <form id="registerForm" novalidate>
          <label>
            Name
            <input id="name" name="name" minlength="2" required />
          </label>
          <label>
            Email
            <input id="email" name="email" type="email" required />
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" minlength="6" required />
          </label>
          <p class="form-error" id="authError" role="alert"></p>
          <button class="primary" type="submit">Register</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="/login.html">Login</a></p>
      </section>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
